<style>

  .go:hover{transform:translateY(-2px)}
  .alt{display:inline-flex; align-items:center; background:transparent; color:var(--coral); font-weight:800; font-size:14px; padding:14px 24px; border-radius:14px; text-decoration:none; box-shadow:inset 0 0 0 2px var(--coral)}
