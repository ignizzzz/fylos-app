<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Fylos keeps health records, daily rhythms, and trusted people in one calm place — one thread through everything. iOS first, Switzerland 2026.">
<title>FYLOS — The Thread</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23E85D2A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E85D2A; --coral-hover:#D04A1C; --coral-deep:#BE4513;
  --bg:#F7F5F2; --surface:#FFFFFF; --chip:#F3EFEB; --sheet:#FBF9F7;
  --peach:#FBE7DD; --peach-selected:#FFEDE3;
  --hair:#EDE8E2; --line:#F1EDE8;
  --ink:#111111; --ink-2:#6E6058; --ink-3:#9B9B9F;
  --label:#A8A29C; --placeholder:#C4BBB3; --chevron:#CFCFD4;
  --ok:#3F8D63; --ok-bg:#F0F7ED; --ok-border:#D7EBDD; --ok-dot:#34C759;
  --warn-warm:#B07A3A; --warn-warm-bg:#FFF8F0; --warn-warm-border:#F0E4D0;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-wordmark:'Nunito',sans-serif;
  --track-title:-0.02em; --track-label:0.12em;
  --r-input:12px; --r-card:16px; --r-group:18px; --r-hero:20px; --r-sheet:26px; --r-full:9999px;
  --h-cta:52px; --h-touch:44px; --gutter:20px;
  --shadow-warm:0 1px 2px rgba(60,30,15,0.03), 0 5px 14px rgba(60,30,15,0.05);
  --shadow-chrome:0 1px 2px rgba(60,30,15,0.04), 0 4px 12px rgba(60,30,15,0.08);
  --shadow-float:0 8px 24px rgba(0,0,0,0.06);
  --glow-cta:0 8px 22px rgba(232,93,42,0.28);
  --glow-cta-sm:0 4px 14px rgba(232,93,42,0.25);
  --t-tap:120ms; --t-normal:200ms; --t-slow:300ms;
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
html,body{overflow-x:clip}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  position:relative;
}
::selection{background:var(--peach-selected);color:var(--coral-deep)}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:4px}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}

/* ---------- The thread layer ---------- */
#threadLayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#threadLayer svg{width:100%;height:100%;overflow:visible}
.thread-path{
  fill:none;stroke:var(--coral);stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.no-js .thread-path{stroke-dasharray:none !important;stroke-dashoffset:0 !important}
.thread-future{
  fill:none;stroke:#CFC5BA;stroke-width:2;stroke-linecap:round;
  stroke-dasharray:2 8;vector-effect:non-scaling-stroke;
}
.tbead{
  fill:var(--coral);opacity:0;
  transform-box:fill-box;transform-origin:center;transform:scale(.2);
  transition:opacity .4s var(--ease-out),transform .5s var(--ease-spring);
}
.tbead.shown{opacity:1;transform:scale(1)}
.tbead.shown.near{transform:scale(1.75)}
.tend{
  fill:var(--coral);opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);
  transition:opacity .45s var(--ease-out),transform .6s var(--ease-spring);
}
.tend.shown{opacity:1;transform:scale(1)}

/* stacking helpers */
.zt{position:relative;z-index:3}
.zu{position:relative;z-index:1}
.thm{position:absolute;width:2px;height:2px;visibility:hidden;pointer-events:none}

/* ---------- Type ---------- */
.eyebrow{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:var(--track-label);color:var(--label);
}
.wordmark{
  font-family:var(--font-wordmark);font-weight:800;
  letter-spacing:-0.02em;color:var(--ink);display:inline-flex;align-items:baseline;
  line-height:1;
}
.wordmark .dot{
  display:inline-block;width:.22em;height:.22em;border-radius:50%;
  background:var(--coral);margin-left:.12em;transform:translateY(-.02em);
}
.wrap{max-width:1000px;margin:0 auto;padding-left:24px;padding-right:24px}

/* ---------- Reveals ---------- */
.rv,.rv-fade{opacity:0;transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}
.rv{transform:translateY(26px)}
.rv.in,.rv-fade.in{opacity:1;transform:none}

/* ---------- Static header ---------- */
.hd{position:relative;z-index:5}
.hd-in{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:30px;padding-bottom:10px;
}
.hd .wordmark{font-size:23px}
.hd-links{display:flex;gap:30px;align-items:center}
.hd-links a{font-size:13.5px;font-weight:600;color:var(--ink-2);transition:color var(--t-normal)}
.hd-links a:hover{color:var(--ink)}
.hd-cta{
  display:inline-flex;align-items:center;justify-content:center;
  height:40px;padding:0 18px;border-radius:var(--r-card);
  background:var(--coral);color:#fff;font-size:13.5px;font-weight:700;
  box-shadow:var(--glow-cta-sm);
  transition:background var(--t-normal),transform var(--t-tap),box-shadow var(--t-normal);
}
.hd-cta:hover{background:var(--coral-hover);transform:translateY(-1px)}
.hd-cta:active{transform:scale(.98)}

/* fixed glass nav after scroll */
.navfix{
  position:fixed;top:14px;left:50%;transform:translate(-50%,-72px);
  z-index:50;display:flex;align-items:center;gap:22px;
  padding:9px 10px 9px 20px;border-radius:var(--r-full);
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hair);box-shadow:var(--shadow-float);
  transition:transform .45s var(--ease-out),opacity .3s;opacity:0;pointer-events:none;
}
.navfix.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.navfix .wordmark{font-size:17px}
.navfix .hd-links{gap:20px}
.navfix .hd-links a{font-size:12.5px}
.navfix .hd-cta{height:34px;padding:0 14px;font-size:12.5px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:var(--h-cta);padding:0 26px;border-radius:var(--r-card);
  background:var(--coral);color:#fff;font-size:15px;font-weight:700;
  box-shadow:var(--glow-cta);
  transition:background var(--t-normal),transform var(--t-tap),box-shadow var(--t-normal);
}
.btn:hover{background:var(--coral-hover);transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,93,42,.32)}
.btn:active{transform:scale(.98)}
.link-ghost{
  display:inline-flex;align-items:center;gap:6px;
  font-size:14.5px;font-weight:700;color:var(--coral);
  transition:color var(--t-normal);
}
.link-ghost:hover{color:var(--coral-hover)}
.link-ghost svg{transition:transform var(--t-normal)}
.link-ghost:hover svg{transform:translateX(3px)}

/* ---------- Hero ---------- */
.hero{padding-top:clamp(64px,10vh,130px);padding-bottom:clamp(150px,24vh,280px);position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:center}
.hero h1{
  font-size:clamp(44px,7.2vw,78px);font-weight:900;
  letter-spacing:-0.03em;line-height:1.02;color:var(--ink);
  margin:18px 0 26px;
}
.hero .sub{font-size:17px;color:var(--ink-2);max-width:480px;line-height:1.6}
.hero-ctas{display:flex;align-items:center;gap:26px;margin-top:38px;flex-wrap:wrap}
.hero-note{margin-top:20px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}

/* ---------- Fragment cards (real app pieces) ---------- */
.card{
  background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow-warm);padding:16px;
}
.frag-booking{width:300px;border-radius:var(--r-group);padding:18px;transform:rotate(1.6deg)}
.frag-booking .top{display:flex;align-items:center;gap:12px}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:16px;
  background:linear-gradient(150deg,#C09A73,#A67C52);
}
.frag-booking .who{min-width:0}
.frag-booking .name{font-size:14px;font-weight:700;color:var(--ink)}
.frag-booking .meta{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.badge-ok{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--r-full);
  color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-border);
  margin-left:auto;flex:none;
}
.frag-booking .when{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.badge-warm{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:var(--r-full);
  color:var(--warn-warm);background:var(--warn-warm-bg);border:1px solid var(--warn-warm-border);
}
.frag-vax{display:inline-flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r-group);transform:rotate(-1.4deg)}
.frag-vax .row{display:flex;align-items:center;gap:10px}
.icon-chip{
  width:36px;height:36px;border-radius:var(--r-input);flex:none;
  background:var(--peach);display:flex;align-items:center;justify-content:center;
}
.icon-chip svg{stroke:var(--coral)}
.frag-vax .t{font-size:14px;font-weight:600;color:var(--ink)}
.frag-vax .s{font-size:12px;color:var(--ink-3);margin-top:1px}
.frag-remind{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-group);width:300px;transform:rotate(1.2deg)}
.chip-circle{
  width:36px;height:36px;border-radius:50%;flex:none;
  background:var(--chip);display:flex;align-items:center;justify-content:center;
}
.chip-circle svg{stroke:var(--coral)}
.frag-remind .t{font-size:14px;font-weight:600;color:var(--ink)}
.frag-remind .s{font-size:12px;color:var(--ink-3);margin-top:1px}
.pill-done{
  margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--coral);
  border:1px solid var(--hair);border-radius:var(--r-full);padding:6px 14px;
  background:var(--surface);transition:background var(--t-normal),transform var(--t-tap);
}
.pill-done:hover{background:var(--peach-selected)}
.pill-done:active{transform:scale(.96)}
.frag-wallet{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-group);width:290px;transform:rotate(-1.2deg)}
.frag-wallet .amt{font-size:15px;font-weight:700;color:var(--ink)}
.frag-wallet .for{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.frag-memory{width:280px;padding:12px;border-radius:var(--r-group);transform:rotate(1.4deg)}
.frag-memory .ph{
  height:130px;border-radius:var(--r-input);
  background:
    radial-gradient(120% 90% at 20% 15%,rgba(255,255,255,.55),transparent 55%),
    linear-gradient(140deg,#FBE7DD 0%,#F6DCC8 55%,#F0CFB4 100%);
}
.frag-memory .cap{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding:0 4px 2px}
.frag-memory .t{font-size:13px;font-weight:600;color:var(--ink)}
.frag-memory .d{font-size:11.5px;color:var(--ink-3);font-weight:500}

/* live walk chip — the thread passes through its pulsing dot */
.live-chip{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);border-radius:var(--r-full);
  box-shadow:var(--shadow-warm);padding:11px 18px 11px 14px;
}
.live-dot{position:relative;width:10px;height:10px;flex:none}
.live-dot::before{
  content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok-dot);
  box-shadow:0 0 0 2px rgba(255,255,255,.9);
}
.live-dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.6px solid var(--ok-dot);opacity:0;
  animation:ping 1.8s var(--ease-out) infinite;
}
@keyframes ping{0%{transform:scale(.5);opacity:.8}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.live-chip .txt{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.live-chip .txt em{font-style:normal;color:var(--ink-3);font-weight:500}

/* sparkline card — the thread IS the sparkline */
.frag-spark{width:320px;padding:18px 18px 8px;border-radius:var(--r-group)}
.frag-spark .head{display:flex;align-items:baseline;justify-content:space-between}
.frag-spark .kpi{font-size:21px;font-weight:800;letter-spacing:-0.02em;color:var(--ink)}
.spark-zone{height:56px;margin-top:6px}
.frag-spark .foot{font-size:11.5px;color:var(--ink-3);font-weight:500;padding-bottom:8px}

/* map fragment beside the phone — the thread continues as the route */
.frag-map{width:280px;padding:12px;border-radius:var(--r-group)}
.frag-map .mapbox{
  position:relative;height:158px;border-radius:var(--r-input);overflow:hidden;
  background:var(--sheet);border:1px solid var(--line);
}
.frag-map .blk{position:absolute;background:var(--chip);border-radius:6px}
.frag-map .blk.b1{left:8%;top:10%;width:26%;height:30%}
.frag-map .blk.b2{left:42%;top:6%;width:34%;height:22%}
.frag-map .blk.b3{left:66%;top:40%;width:26%;height:34%}
.frag-map .blk.b4{left:10%;top:56%;width:30%;height:30%}
.frag-map .blk.b5{left:46%;top:66%;width:14%;height:22%}
.frag-map .cap{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding:0 4px 2px}
.frag-map .t{font-size:13px;font-weight:600;color:var(--ink)}
.frag-map .d{font-size:11.5px;color:var(--ink-3);font-weight:500}
</style>
